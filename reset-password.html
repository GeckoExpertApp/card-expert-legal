<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Card Expert</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #F7F8FA; max-width: 480px; margin: 0 auto; padding: 24px; background: #090D14; }
    h1 { color: #F5B942; font-size: 1.75rem; margin-bottom: 8px; }
    p, li { margin-bottom: 12px; color: #A2A9B6; }
    .updated { color: #727C8D; font-size: 0.9rem; margin-bottom: 24px; }
    a { color: #F5B942; }
    label { display: block; color: #F7F8FA; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 12px; border: 1px solid #242E3D; background: #0D131D; color: #F7F8FA; font-size: 16px; margin-bottom: 16px; }
    button { width: 100%; padding: 16px; border: none; border-radius: 16px; background: linear-gradient(135deg, #FFD76A, #F5B942, #F28C28); color: #111318; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { background: #242A34; color: #626B79; cursor: not-allowed; }
    .message { margin-top: 16px; }
    .error { color: #FF6262; }
    .success { color: #45D483; }
    .hidden { display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Reset Password</h1>
  <p class="updated">Card Expert</p>
  <p id="status">Checking your reset link...</p>

  <form id="reset-form" class="hidden">
    <label for="password">New password</label>
    <input id="password" type="password" minlength="6" required autocomplete="new-password" />
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" minlength="6" required autocomplete="new-password" />
    <button id="submit" type="submit">Update password</button>
  </form>

  <p id="message" class="message"></p>

  <script>
    const SUPABASE_URL = 'https://yxsqoqwcbomwislfdsed.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4c3FvcXdjYm9td2lzbGZkc2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkzMDE3MTUsImV4cCI6MjA3NDg3NzcxNX0.b68twWlp6geOZ-CM0xtLuIJDR_oxWaXP9KIOvVI3VYA';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const statusEl = document.getElementById('status');
    const formEl = document.getElementById('reset-form');
    const messageEl = document.getElementById('message');
    const submitEl = document.getElementById('submit');

    function showError(text) {
      statusEl.textContent = 'This reset link is invalid or has expired. Request a new one from the Card Expert app.';
      messageEl.className = 'message error';
      messageEl.textContent = text;
    }

    async function prepareSession() {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const queryParams = new URLSearchParams(window.location.search);

      const errorDescription = hashParams.get('error_description') || queryParams.get('error_description');
      if (errorDescription) {
        showError(errorDescription.replace(/\+/g, ' '));
        return false;
      }

      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      if (accessToken && refreshToken) {
        const { error } = await client.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (error) {
          showError(error.message);
          return false;
        }
        return true;
      }

      const { data } = await client.auth.getSession();
      return Boolean(data.session);
    }

    prepareSession().then((ready) => {
      if (!ready) {
        if (!messageEl.textContent) {
          showError('Open this page from the password reset email.');
        }
        return;
      }
      statusEl.textContent = 'Choose a new password for your Card Expert account.';
      formEl.classList.remove('hidden');
    });

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        messageEl.className = 'message error';
        messageEl.textContent = 'Passwords do not match.';
        return;
      }

      submitEl.disabled = true;
      messageEl.textContent = '';

      const { error } = await client.auth.updateUser({ password });
      submitEl.disabled = false;

      if (error) {
        messageEl.className = 'message error';
        messageEl.textContent = error.message;
        return;
      }

      formEl.classList.add('hidden');
      statusEl.textContent = 'Your password has been updated.';
      messageEl.className = 'message success';
      messageEl.textContent = 'You can close this page and sign in with Card Expert.';
    });
  </script>
</body>
</html>
